<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Today</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>☕</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__lead">
        <h1 id="greeting">Today</h1>
        <p class="topbar__date" id="date"></p>
      </div>
      <nav class="chips" id="chips" aria-label="Jump to section"></nav>
      <div class="topbar__actions">
        <span class="status" id="status">Loading…</span>
        <button id="refresh" class="button" type="button" title="Refresh (r)">Refresh</button>
      </div>
    </header>

    <main id="board" class="board" aria-busy="true">
      <p class="placeholder">Fetching your day…</p>
    </main>

    <footer class="footer">
      <span><kbd>r</kbd> refresh · auto-refreshes every 2 minutes</span>
    </footer>

    <script src="/app.js" type="module"></script>
  </body>
</html>
